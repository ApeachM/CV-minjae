experiences:
  title: Experience
  info:
  - role: R&D Team Leader
    time: July.2026 - present
    company: BAUM Design Systems, Korea
    details: |
      - Leading the R&D team for commercial EDA tool development.

  - role: Engineer
    time: Feb.2024 - July.2026
    company: BAUM Design Systems, Korea
    details: |
      - Developed core components of the power model generation flow.
      - Replaced a commercial SystemVerilog frontend with an open-source based parsing layer, enabling license-clean builds without stub code.
      - Implemented an RTL-to-gate elaborator to supply gate synthesis functionality absent from the open-source frontend.
      - Implemented a native Liberty parser (lexer / parser / AST), validated by parity comparison against the legacy backend over an expanded test corpus.
      - Led development of a sequential equivalence checker (sequential miter, ABC proof engine, counterexample re-validation) that certifies clock-gating insertion, retiming, and register merging as behavior-preserving, with a three-state PASS / FAIL / INCONCLUSIVE verdict.
      - Built and owned the multi-OS packaging and release pipeline (RHEL / AlmaLinux / CentOS) and the regression, nightly, and code-quality CI infrastructure.
      - Developed an MCP server exposing the toolchain to LLM agents, with an evaluation harness for regression tracking.

  - role: Open-Source Contributor
    time: Feb.2024 - present
    company: OpenROAD Project (github.com/dev-minjae)
    details: |
      - GPU acceleration of the Nesterov-based global placer using Kokkos (54 files, ~8.6K lines): 6x speedup on an RTX 5090, with the CPU path left bit-identical when GPU support is disabled.
      - Contributed agent skills (fix-bug / add-test / review-pr) to the project's development workflow.

  - role: Visiting Scholar
    time: June.2023 - Feb.2024
    company: ABK Group, UCSD (University of California, San Diego)
    details: |
      - Worked primarily on 3D IC placement: developed a multi-die manager prototype (partitioning, legalization, timing, routing) — handed off for continued development.
      - Contributed to the [OpenROAD](https://github.com/The-OpenROAD-Project/OpenROAD) project: implemented RUDY (Routing Utilization estimation with heatmap visualization) and odb exception handling for multi-block designs.

  - role: Hardware Develop Team Leader
    time: June.2020 - September.2021
    company: Startup Do:main, Gang-Nam in Korea
    details: |
      - Developed medical EEG equipment: full-cycle hardware from circuit design (ADS1299) through PCB fabrication to firmware development.

  - role: Undergraduate Research Intern
    time: June.2019 - December.2019
    company: Bio-inspired Advanced Sensors Lab (BIAS), UNIST in Korea
    details: |
      - Cadence Virtuoso analog circuit design & verification.
      - Implementation of DAC chip protocol with Verilog & UI for ADC application.

  - role: Undergraduate Research Intern
    time: February.2019 - August.2019
    company: Brain Computer Interface Lab (BCI), UNIST in Korea
    details: |
      - Analyzed realtime EEG data with CNN.

  - role: Undergraduate Research Intern
    time: November.2018 - March.2019
    company: Institute for Basic Science (IBS), UNIST in Korea
    details: |
      - Data mining for Microglia cell migration.

