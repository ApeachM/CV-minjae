career-profile:
  title: Career Profile
  summary: |
    Minjae Kim received the B.S. degree in Electrical Engineering (Major) and Computer Science Engineering (Minor) from Ulsan National Institute of Science and Technology (UNIST), Ulsan, South Korea in 2022, and the M.S. degree in Electrical Engineering from Pohang University of Science and Technology (POSTECH), Pohang, South Korea in 2024. His research was conducted with Prof. Seokhyeong Kang in [CAD & SoC Design Lab.](http://csdl.postech.ac.kr).

    During his M.S. program, he was a visiting scholar at the [ABK Group](https://vlsicad.ucsd.edu), [UCSD](https://ucsd.edu) (University of California, San Diego) from June 2023 to February 2024, where he worked primarily on 3D IC placement — prototyping a multi-die manager — and contributed to the open-source EDA platform [OpenROAD](https://github.com/The-OpenROAD-Project/OpenROAD).

    He is currently an R&D Team Leader at [BAUM Design Systems](https://www.baum-ds.com), specializing in design and development of EDA tools. He continues to contribute to OpenROAD as [dev-minjae](https://github.com/dev-minjae) — most recently a Kokkos-based GPU acceleration of the global placer, achieving a 6x speedup while remaining bit-identical to the CPU path when GPU is disabled.

