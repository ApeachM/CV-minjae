career-profile:
  title: Career Profile
  summary: |
    Minjae Kim received the B.S. degree in Electrical Engineering (Major) and Computer Science Engineering (Minor) from Ulsan National Institute of Science and Technology (UNIST), Ulsan, South Korea in 2022, and the M.S. degree in Electrical Engineering from Pohang University of Science and Technology (POSTECH), Pohang, South Korea in 2024. His research was conducted with Prof. Seokhyeong Kang in [CAD & SoC Design Lab.](http://csdl.postech.ac.kr).

    During his M.S. program, he was a visiting scholar at the [ABK Group](https://vlsicad.ucsd.edu), [UCSD](https://ucsd.edu) (University of California, San Diego) from June 2023 to February 2024, contributing to the open-source EDA platform [OpenROAD](https://github.com/The-OpenROAD-Project/OpenROAD) — implementing routing utilization estimation (RUDY) and prototyping a 3D IC multi-die manager.

    He is currently working as an engineer at [BAUM Design Systems](https://www.baum-ds.com), specializing in design and development of EDA tools.

